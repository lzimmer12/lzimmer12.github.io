  <div class="main">

    <img class="mySlides fade" src="./images/IMG_3615.png">
    <img class="mySlides fade" src="./images/IMG_5802.png">
    <img class="mySlides fade" src="./images/IMG_3586.jpg">
    <img class="mySlides fade" src="./images/IMG_3648.png">

    <button class="button__left" onclick="plusDivs(-1)">&#10094;</button>
    <button class="button__right" onclick="plusDivs(+1)">&#10095;</button> 
  </div>

  <script>
var slideIndex = 1;
showDivs(slideIndex);

function plusDivs(n) {
  showDivs(slideIndex += n);
}

function showDivs(n) {
  var i;
  var x = document.getElementsByClassName("mySlides");
  if (n > x.length) {slideIndex = 1}
  if (n < 1) {slideIndex = x.length}
  for (i = 0; i < x.length; i++) {
    x[i].style.display = "none";  
  }
  x[slideIndex-1].style.display = "block";  
}

setInterval(function() {
  plusDivs(1);
}, 4000);
</script>
</body>
